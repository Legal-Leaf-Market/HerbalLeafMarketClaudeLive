<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
  <!-- Herbal Leaf Market app/browser mark.
       The bells are the same cup + flared skirt as the hero sprig in
       index.html (#sprigIcon) and the header logo (#lilyIcon). The skirts
       previously carried fill="none", so the bottom third of every bell was a
       hollow outline and the mark read as unfinished at any size. They now
       carry the cup's own fill.
       Each skirt stays an OPEN path: SVG closes an open subpath implicitly
       when filling, bounded by the chord between its endpoints, which sits at
       the cup's widest point with the cup's rounded bottom hanging below it.
       The two overlap seamlessly. Closing with Z would stroke that chord as a
       visible line straight across the bell. -->
  <rect width='100' height='100' rx='14' fill='#0f1811'/>
  <circle cx='50' cy='50' r='44' fill='none' stroke='#C8922A' stroke-width='1.5' opacity='0.5'/>
  <path d='M44 95 C32 78 20 60 25 40 C28 52 35 70 44 86 Z' fill='#22c55e' opacity='0.75'/>
  <path d='M56 95 C68 78 80 60 75 40 C72 52 65 70 56 86 Z' fill='#16a34a' opacity='0.65'/>
  <path d='M50 92 C49 74 50 60 55 44 C59 32 64 23 68 16' fill='none' stroke='#4ade80' stroke-width='2.2' stroke-linecap='round'/>
  <!-- Pedicels all painted BEFORE any bell (a stalk hangs behind the flower
       in front of it); interleaving them with the bells painted each stalk
       over the bell above. Same fix as the hero sprig and header logo. -->
  <line x1='68' y1='16' x2='65' y2='23' stroke='#4ade80' stroke-width='1.4' stroke-linecap='round'/>
  <line x1='65' y1='32' x2='61' y2='40' stroke='#4ade80' stroke-width='1.4' stroke-linecap='round'/>
  <line x1='60' y1='50' x2='55' y2='60' stroke='#4ade80' stroke-width='1.5' stroke-linecap='round'/>
  <g transform='translate(65,23)'>
    <path d='M-3,0 A3,2 0 0,1 3,0 C7,1.5 9,5 9,10 C6,12 3.5,12.5 0,12.5 C-3.5,12.5 -6,12 -9,10 C-9,5 -7,1.5 -3,0 Z' fill='#f2fbf2' stroke='#267020' stroke-width='1'/>
    <path d='M-9,10 C-12,12.5 -14,15 -13.5,17 C-11.5,18.5 -6.5,19.5 0,19.5 C6.5,19.5 11.5,18.5 13.5,17 C14,15 12,12.5 9,10' fill='#f2fbf2' stroke='#267020' stroke-width='1' stroke-linecap='round'/>
  </g>
  <g transform='translate(61,40)'>
    <path d='M-3.5,0 A3.5,2.5 0 0,1 3.5,0 C8.5,2 11,6.5 11,13 C7.5,15.5 4.5,16 0,16 C-4.5,16 -7.5,15.5 -11,13 C-11,6.5 -8.5,2 -3.5,0 Z' fill='#ecf9ea' stroke='#267020' stroke-width='1'/>
    <path d='M-11,13 C-14.5,16 -17,19 -16.5,21.5 C-14,23.5 -8,24.5 0,24.5 C8,24.5 14,23.5 16.5,21.5 C17,19 14.5,16 11,13' fill='#ecf9ea' stroke='#267020' stroke-width='1' stroke-linecap='round'/>
  </g>
  <g transform='translate(55,60)'>
    <path d='M-4,0 A4,3 0 0,1 4,0 C10,2.5 13,8 13,17 C9,20 5.5,20.5 0,20.5 C-5.5,20.5 -9,20 -13,17 C-13,8 -10,2.5 -4,0 Z' fill='#e3f7e0' stroke='#1f5c18' stroke-width='1.1'/>
    <path d='M-13,17 C-17,21 -20,25 -19.5,28 C-16.5,30.5 -9.5,32 0,32 C9.5,32 16.5,30.5 19.5,28 C20,25 17,21 13,17' fill='#e3f7e0' stroke='#1f5c18' stroke-width='1.1' stroke-linecap='round'/>
  </g>
</svg>
